services:
  healthri-basket-api:
    image: healthri-basket-api
    container_name: healthri-basket-api
    build:
      dockerfile: ./healthri_basket_api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: true
    depends_on: [keycloak, db]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    ports:
      - "8081:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: ["start-dev"]

  db:
    image: postgres:18
    container_name: postgres
    # Exposing the Postgres port to the host is intended ONLY for local development.
    # Remove or restrict this in production environments to avoid security risks.
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: healthri_basket_api
    volumes:
      - pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  keycloak_data:
  pg18data:  
